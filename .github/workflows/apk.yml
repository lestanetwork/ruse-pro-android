name: Build ruse.pro APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: v3_openjdk
          submodules: recursive
          path: pojav
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: LTW
        run: |
          cd pojav/app_pojavlauncher/libs
          curl -fL -O https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: pojav/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav

      - name: JRE 17
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: pojav/app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav

      - name: JRE 21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: pojav/app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11" }

      - name: ruse.pro yamasi
        run: python3 android/patch.py pojav android

      - name: JRE jar dosyalari
        working-directory: pojav
        run: |
          ./scripts/languagelist_updater.sh
          gradle :jre_lwjgl3glfw:build --no-daemon

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: APK derle
        working-directory: pojav
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mkdir -p ../out
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk ../out/ruse-pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ruse-pro-apk
          path: out/ruse-pro.apk
